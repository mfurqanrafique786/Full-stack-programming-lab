<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calculator - Task 2</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 40px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; border: 1px solid #ddd; min-height: 24px; transition: 0.3s; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Interactive Calculator</h2>
        
        <input type="number" id="num1" placeholder="First Number">
        
        <select id="operator">
            <option value="add">Addition (+)</option>
            <option value="subtract">Subtraction (-)</option>
            <option value="multiply">Multiplication (×)</option>
            <option value="divide">Division (÷)</option>
        </select>
        
        <input type="number" id="num2" placeholder="Second Number">
        
        <button onclick="runCalculator()">Calculate</button>
        
        <div id="calc-result" class="result-box">Enter numbers to start</div>
    </div>

    <script src="script2.js"></script>
</body>
</html>
