<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Box Generator - Task 4</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; text-align: center; background-color: #f8f9fa; }
        .controls { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; margin-bottom: 20px; }
        input { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .add-btn { background-color: #28a745; color: white; }
        .clear-btn { background-color: #dc3545; color: white; margin-top: 10px; }
        
        #box-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; min-height: 120px; }
        .color-box { width: 100px; height: 100px; border-radius: 8px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        
        #browser-info { margin-top: 30px; font-size: 0.9em; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <h2>Color Box Generator</h2>

    <div class="controls">
        <input type="text" id="colorInput1" placeholder="Color 1 (e.g. Red)">
        <button class="add-btn" onclick="addColorBox('colorInput1')">Add Box</button>
        <br>
        <input type="text" id="colorInput2" placeholder="Color 2 (e.g. #3498db)">
        <button class="add-btn" onclick="addColorBox('colorInput2')">Add Box</button>
        <br>
        <input type="text" id="colorInput3" placeholder="Color 3 (e.g. rgb(0,255,0))">
        <button class="add-btn" onclick="addColorBox('colorInput3')">Add Box</button>
        <br>
        <button class="clear-btn" onclick="clearBoxes()">Clear All Boxes</button>
    </div>

    <div id="box-container"></div>

    <div id="browser-info"></div>

    <script src="script4.js"></script>
</body>
</html>
